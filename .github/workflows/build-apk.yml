name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/naturehomecleaning/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NatureHomeCleaning"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.naturehomecleaning.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.naturehomecleaning.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#168A45</item>
                  <item name="android:navigationBarColor">#168A45</item>
                  <item name="android:statusBarColor">#168A45</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Nature Home Cleaning Services"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/naturehomecleaning/app/MainActivity.java <<'EOF'
          package com.naturehomecleaning.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient());

                  String html =
                      "<!DOCTYPE html>" +
                      "<html><head>" +
                      "<meta name='viewport' content='width=device-width, initial-scale=1'>" +
                      "<title>Nature Home Cleaning Services</title>" +
                      "<style>" +
                      "*{box-sizing:border-box}" +
                      "body{margin:0;font-family:Arial;background:#f2f8f4;color:#222}" +
                      ".hero{background:#168A45;color:white;text-align:center;padding:28px 15px}" +
                      ".logo{font-size:48px}" +
                      "h1{font-size:25px;margin:8px 0}" +
                      ".tag{font-size:16px}" +
                      ".card{background:white;margin:15px;padding:18px;border-radius:14px;box-shadow:0 2px 8px #bbb}" +
                      "h2{color:#168A45}" +
                      "label{display:block;margin-top:12px;font-weight:bold}" +
                      "input,select,textarea{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:16px}" +
                      "button{width:100%;padding:14px;margin-top:18px;background:#168A45;color:white;border:0;border-radius:8px;font-size:17px;font-weight:bold}" +
                      ".service{padding:8px 0;border-bottom:1px solid #eee}" +
                      "</style></head><body>" +

                      "<div class='hero'>" +
                      "<div class='logo'>🏠🌿</div>" +
                      "<h1>NATURE HOME CLEANING SERVICES</h1>" +
                      "<div class='tag'>Clean Home, Happy Life</div>" +
                      "</div>" +

                      "<div class='card'>" +
                      "<h2>Our Services</h2>" +
                      "<div class='service'>🏠 Home Cleaning</div>" +
                      "<div class='service'>🍳 Kitchen Cleaning</div>" +
                      "<div class='service'>🚿 Bathroom Cleaning</div>" +
                      "<div class='service'>✨ Deep Cleaning</div>" +
                      "<div class='service'>🪟 Glass Cleaning</div>" +
                      "<div class='service'>🛋️ Carpet & Sofa Cleaning</div>" +
                      "</div>" +

                      "<div class='card' id='book'>" +
                      "<h2>Book a Cleaning</h2>" +

                      "<label>Name</label>" +
                      "<input id='name' placeholder='Your Name'>" +

                      "<label>Phone</label>" +
                      "<input id='phone' type='tel' placeholder='Your Phone Number'>" +

                      "<label>Service</label>" +
                      "<select id='service'>" +
                      "<option>Home Cleaning</option>" +
                      "<option>Kitchen Cleaning</option>" +
                      "<option>Bathroom Cleaning</option>" +
                      "<option>Deep Cleaning</option>" +
                      "<option>Glass Cleaning</option>" +
                      "<option>Carpet & Sofa Cleaning</option>" +
                      "</select>" +

                      "<label>Date</label>" +
                      "<input id='date' type='date'>" +

                      "<label>Preferred Time</label>" +
                      "<input id='time' type='time'>" +

                      "<label>Area</label>" +
                      "<select id='area'>" +
                      "<option>Hanamkonda</option>" +
                      "<option>Warangal</option>" +
                      "<option>Kazipet</option>" +
                      "<option>Karimnagar</option>" +
                      "<option>Mancherial</option>" +
                      "</select>" +

                      "<label>Full Address</label>" +
                      "<textarea id='address' rows='3' placeholder='Enter full address'></textarea>" +

                      "<button onclick='sendBooking()'>SEND BOOKING ON WHATSAPP</button>" +
                      "</div>" +

                      "<div class='card' style='text-align:center'>" +
                      "<b>Call: 9381110710</b><br><br>" +
                      "HANAMKONDA | WARANGAL | KAZIPET | KARIMNAGAR | MANCHERIAL" +
                      "</div>" +

                      "<script>" +
                      "function sendBooking(){" +
                      "var msg='NATURE HOME CLEANING SERVICES%0A%0A'" +
                      "+'Name: '+encodeURIComponent(document.getElementById('name').value)" +
                      "+'%0APhone: '+encodeURIComponent(document.getElementById('phone').value)" +
                      "+'%0AService: '+encodeURIComponent(document.getElementById('service').value)" +
                      "+'%0ADate: '+encodeURIComponent(document.getElementById('date').value)" +
                      "+'%0ATime: '+encodeURIComponent(document.getElementById('time').value)" +
                      "+'%0AArea: '+encodeURIComponent(document.getElementById('area').value)" +
                      "+'%0AAddress: '+encodeURIComponent(document.getElementById('address').value);" +
                      "window.location.href='https://wa.me/919381110710?text='+msg;" +
                      "}" +
                      "</script>" +

                      "</body></html>";

                  webView.loadDataWithBaseURL(
                      null,
                      html,
                      "text/html",
                      "UTF-8",
                      null
                  );

                  setContentView(webView);
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NatureHomeCleaning-APK
          path: app/build/outputs/apk/debug/app-debug.apk
