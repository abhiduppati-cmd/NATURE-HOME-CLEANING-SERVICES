name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/naturehomecleaning/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NatureHomeCleaning"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.naturehomecleaning.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.naturehomecleaning.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#168A45</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#168A45</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="Nature Home Cleaning Services"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/naturehomecleaning/app/MainActivity.java <<'EOF'
          package com.naturehomecleaning.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Nature Home Cleaning Services</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;font-family:Arial,sans-serif;background:#f5fff8;color:#17351f}
          .hero{background:#168A45;color:white;padding:32px 20px;border-radius:0 0 28px 28px}
          .logo{font-size:44px}
          h1{margin:8px 0;font-size:28px}
          .tag{font-size:16px}
          .btn{display:block;text-align:center;background:white;color:#168A45;padding:15px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:20px}
          .card{background:white;margin:16px;padding:18px;border-radius:18px;box-shadow:0 3px 12px #0001}
          h2{color:#168A45}
          label{display:block;margin-top:12px;font-weight:bold}
          input,select,textarea{width:100%;padding:13px;margin-top:6px;border:1px solid #ccc;border-radius:9px;font-size:15px}
          button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:10px;background:#168A45;color:white;font-size:16px;font-weight:bold}
          .services{line-height:2}
          </style>
          </head>
          <body>
          <div class="hero">
          <div class="logo">🏠✨</div>
          <h1>NATURE HOME CLEANING SERVICES</h1>
          <div class="tag">Clean Home, Happy Life</div>
          <a class="btn" href="#book">BOOK NOW</a>
          </div>

          <div class="card">
          <h2>Our Services</h2>
          <div class="services">
          🧹 Home Cleaning<br>
          🍳 Kitchen Cleaning<br>
          🚿 Bathroom Cleaning<br>
          ✨ Deep Cleaning<br>
          🪟 Glass Cleaning<br>
          🛋️ Carpet & Sofa Cleaning
          </div>
          </div>

          <div class="card">
          <h2>Service Areas</h2>
          Hanamkonda • Warangal • Kazipet • Karimnagar • Mancherial
          </div>

          <div class="card" id="book">
          <h2>Book a Cleaning</h2>

          <label>Name</label>
          <input id="name" placeholder="Your name">

          <label>Phone</label>
          <input id="phone" type="tel" placeholder="Your phone number">

          <label>Service</label>
          <select id="service">
          <option>Home Cleaning</option>
          <option>Kitchen Cleaning</option>
          <option>Bathroom Cleaning</option>
          <option>Deep Cleaning</option>
          <option>Glass Cleaning</option>
          <option>Carpet & Sofa Cleaning</option>
          </select>

          <label>Date</label>
          <input id="date" type="date">

          <label>Preferred Time</label>
          <input id="time" type="time">

          <label>Area</label>
          <select id="area">
          <option>Hanamkonda</option>
          <option>Warangal</option>
          <option>Kazipet</option>
          <option>Karimnagar</option>
          <option>Mancherial</option>
          </select>

          <label>Full Address</label>
          <textarea id="address" rows="3" placeholder="Enter your full address"></textarea>

          <button onclick="sendBooking()">SEND BOOKING ON WHATSAPP</button>
          </div>

          <script>
          function sendBooking(){
            let msg =
            "NATURE HOME CLEANING SERVICES - BOOKING%0A%0A"+
            "Name: "+encodeURIComponent(document.getElementById("name").value)+"%0A"+
            "Phone: "+encodeURIComponent(document.getElementById("phone").value)+"%0A"+
            "Service: "+encodeURIComponent(document.getElementById("service").value)+"%0A"+
            "Date: "+encodeURIComponent(document.getElementById("date").value)+"%0A"+
            "Time: "+encodeURIComponent(document.getElementById("time").value)+"%0A"+
            "Area: "+encodeURIComponent(document.getElementById("area").value)+"%0A"+
            "Address: "+encodeURIComponent(document.getElementById("address").value);

            window.location.href="https://wa.me/919381110710?text="+msg;
          }
          </script>
          </body>
          </html>
          EOF

      - name: Build Debug APK
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle Build
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NatureHomeCleaning-APK
          path: app/build/outputs/apk/debug/app-debug.apk
